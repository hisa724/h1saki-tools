; h1saki-tools OBS スクリプト共通設定
;
; このファイルを同じフォルダに settings.ini という名前でコピーして、値を書き換えて使う。
; settings.ini は個人の環境（パス・デバイス名）を含むので Git には入れない（.gitignore 済み）。
;
; 書式:  キー=値   （; で始まる行はコメント。値に引用符は不要。空欄は「未設定」扱い）
; 優先順位:  スクリプトの引数（-GainDb 18 など） > settings.ini > スクリプト内の既定値

[audio]
; configure-audio_ver.0.1 — マイクとデスクトップ音声
GainDb=18.5
ExpanderThreshold=-45
CompressorThreshold=-20
DuckThreshold=-35
DuckRatio=10
MicName=マイク
DesktopName=デスクトップ音声
; --- 要らないフィルタは false にする（スクリプトの編集は不要）---
NoiseSuppress=true
Expander=true
Equalizer=true
Compressor=true
Limiter=true
; Ducking=false にすると、デスクトップ音声はリミッターだけになる
Ducking=true

[standby]
; add-standby-scene_ver.0.1 — 待機画面シーン
; VideoPath は必須。継ぎ目を消したループ動画（README の ffmpeg 手順参照）
SceneName=待機画面
VideoPath=C:\obs\standby\standby_loop.mp4
; BgmPath を空にすると BGM ソースを作らない
BgmPath=
BgmGainDb=-8
Line1=まもなく配信を開始します
Line2=
FontName=LINE Seed JP ExtraBold
FontSize=88
